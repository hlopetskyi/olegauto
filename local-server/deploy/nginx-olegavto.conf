server {
    server_name olegavto.com www.olegavto.com;

    # Redirect www -> apex (canonical host)
    if ($host = www.olegavto.com) {
        return 301 https://olegavto.com$request_uri;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50m;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/olegavto.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/olegavto.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.olegavto.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = olegavto.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name olegavto.com www.olegavto.com;
    return 404; # managed by Certbot
}
